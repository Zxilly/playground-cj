name: Runs All Unit tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          standalone: 'true'

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve locked Cangjie toolchain
        id: cangjie_toolchain
        shell: bash
        run: |
          set -euo pipefail
          lock=cj-runner/cangjie-toolchain.lock.json
          echo "release=$(jq -er '.release' "$lock")" >> "$GITHUB_OUTPUT"
          echo "sdk_sha256=$(jq -er '.sdk.sha256' "$lock")" >> "$GITHUB_OUTPUT"

      - name: Cache locked Cangjie archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cangjie/cangjie-sdk-linux-x64-${{ steps.cangjie_toolchain.outputs.release }}.tar.gz
          key: cangjie-sdk-linux-x64-${{ steps.cangjie_toolchain.outputs.release }}-${{ steps.cangjie_toolchain.outputs.sdk_sha256 }}

      - name: Install locked Cangjie toolchain
        shell: bash
        run: |
          set -euo pipefail
          release='${{ steps.cangjie_toolchain.outputs.release }}'
          archive="$HOME/.cache/cangjie/cangjie-sdk-linux-x64-$release.tar.gz"
          sdk_parent="$RUNNER_TEMP/cangjie-sdk-$release"
          bash cj-runner/install-cangjie-toolchain.sh \
            --sdk-parent "$sdk_parent" \
            --archive "$archive"
          sdk_root="$sdk_parent/cangjie"
          echo "CANGJIE_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "CJC=$sdk_root/bin/cjc" >> "$GITHUB_ENV"
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/tools/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$sdk_root/runtime/lib/linux_x86_64_cjnative:$sdk_root/tools/lib" \
            >> "$GITHUB_ENV"

      - name: Verify repository review declaration and compile Content Packs with cjc
        run: pnpm content-packs:verify

      - name: Run Lint
        run: pnpm run lint

      - name: Execute Unit tests
        run: pnpm run test:run

  runner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Use Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cj-runner/go.mod
          cache: false

      - name: Test runner with race detection
        working-directory: cj-runner
        run: go test -race ./...

      - name: Vet runner
        working-directory: cj-runner
        run: go vet ./...

      - name: Build runner
        working-directory: cj-runner
        run: go build -trimpath -o "$RUNNER_TEMP/cj-runner" ./cmd/runner
