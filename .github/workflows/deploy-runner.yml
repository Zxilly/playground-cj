name: Modal runner

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - cj-runner/**
      - modal/**
      - .github/workflows/deploy-runner.yml

concurrency:
  group: modal-runner-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cj-runner/go.mod
          cache: false

      - name: Verify runner
        working-directory: cj-runner
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath ./cmd/runner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pinned Modal CLI
        run: python -m pip install modal==1.5.3

      - name: Publish runner image to Modal
        run: modal run modal/build_runner_image.py

      - name: Deploy Modal gateway
        run: modal deploy modal/runner.py
