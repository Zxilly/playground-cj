name: cj-runner image

on:
  workflow_dispatch:
  push:
    branches: [ai-mode-rebuild]
    paths:
      - cj-runner/**
      - .github/workflows/deploy-runner.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cj-runner
          push: true
          # Single-arch, no attestation manifest — ACA pulls a plain OCI image.
          provenance: false
          tags: |
            ghcr.io/zxilly/cj-runner:latest
            ghcr.io/zxilly/cj-runner:${{ github.sha }}
