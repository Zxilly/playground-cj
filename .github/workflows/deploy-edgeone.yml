name: EdgeOne Makers

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Runs All Unit tests]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: edgeone-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: EdgeOne Production
      url: https://play.cj.zxilly.com
    env:
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check deployment configuration
        run: |
          test -n "$EDGEONE_PROJECT_NAME"
          test -n "$EDGEONE_API_TOKEN"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Prepare EdgeOne CLI with Turbopack compatibility fix
        run: |
          npm install --prefix "$RUNNER_TEMP/edgeone-cli" --no-package-lock --no-audit --no-fund edgeone@1.6.44
          node scripts/patch-edgeone-turbopack.mjs "$RUNNER_TEMP/edgeone-cli/node_modules/edgeone"

      - name: Login to Tencent Cloud China
        run: node "$RUNNER_TEMP/edgeone-cli/node_modules/edgeone/edgeone-bin/edgeone.js" login --site china --token "$EDGEONE_API_TOKEN"

      - name: Build and deploy the Next.js application
        run: >-
          node "$RUNNER_TEMP/edgeone-cli/node_modules/edgeone/edgeone-bin/edgeone.js" makers deploy
          --name "$EDGEONE_PROJECT_NAME" --area global --env production
          --skip-ai-gateway-sync

      - name: Verify compiled Turbopack middleware
        run: node scripts/verify-edgeone-middleware.mjs "$RUNNER_TEMP/edgeone-cli/node_modules/edgeone"

      - name: Verify public deployment
        run: node scripts/verify-edgeone-deployment.mjs https://play.cj.zxilly.com
